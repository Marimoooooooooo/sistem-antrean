<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Enterprise Student Queue System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-6 antialiased relative overflow-hidden">
    
    <!-- Background Decor -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-900/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-blue-900/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-xl shadow-xl z-10 overflow-hidden">
        
        <div class="p-8 text-center border-b border-slate-700">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-lg bg-blue-600 mb-4 shadow-sm">
                <i data-lucide="shield-check" class="text-white w-6 h-6"></i>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-tight">Admin Portal</h1>
            <p class="text-slate-400 text-sm mt-1">Masuk untuk mengelola sistem antrean</p>
        </div>

        <form class="p-8 flex flex-col gap-5" onsubmit="event.preventDefault(); QueueSystem.navigate('admin-dashboard.html');">
            
            <div class="flex flex-col gap-2">
                <label for="username" class="text-sm font-medium text-slate-300">Username</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="user" class="w-5 h-5 text-slate-500"></i>
                    </div>
                    <input type="text" id="username" required placeholder="Masukkan username" class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-10 pr-4 py-3 text-slate-100 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder-slate-500">
                </div>
            </div>

            <div class="flex flex-col gap-2">
                <div class="flex justify-between items-center">
                    <label for="password" class="text-sm font-medium text-slate-300">Password</label>
                    <a href="admin-forgot.html" class="text-xs text-blue-400 hover:text-blue-300 transition-colors">Lupa Password?</a>
                </div>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="lock" class="w-5 h-5 text-slate-500"></i>
                    </div>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-10 pr-4 py-3 text-slate-100 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder-slate-500">
                </div>
            </div>

            <button type="submit" class="w-full bg-blue-700 hover:bg-blue-600 text-white font-medium py-3 px-4 rounded-lg transition-colors mt-4 shadow-sm flex justify-center items-center gap-2">
                Masuk
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
            
        </form>

    </div>

    <script src="assets/js/app.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
