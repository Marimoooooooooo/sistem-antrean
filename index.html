<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilih Layanan - Enterprise Student Queue System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col antialiased">
    
    <!-- Header -->
    <header class="p-6 bg-slate-900 border-b border-slate-700 sticky top-0 z-10 shadow-sm">
        <h1 class="text-xl font-semibold text-center tracking-wide">Layanan Mahasiswa</h1>
        <p class="text-slate-400 text-sm text-center mt-1">Silakan pilih layanan yang Anda butuhkan</p>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-6 flex flex-col gap-4 max-w-md mx-auto w-full justify-center">
        
        <!-- Card 1: Pengambilan KPM -->
        <button onclick="selectService('Pengambilan KPM', 'KPM')" class="w-full text-left bg-slate-800 border border-slate-700 rounded-lg p-5 shadow-sm hover:bg-slate-700 transition-colors duration-200 group flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-blue-900/50 flex items-center justify-center text-blue-500 group-hover:bg-blue-600 group-hover:text-white transition-colors duration-200">
                    <i data-lucide="credit-card"></i>
                </div>
                <div>
                    <h2 class="text-lg font-medium text-slate-100">Pengambilan KPM</h2>
                    <p class="text-sm text-slate-400 mt-0.5">Kartu Tanda Mahasiswa</p>
                </div>
            </div>
            <i data-lucide="chevron-right" class="text-slate-500 group-hover:text-slate-300"></i>
        </button>

        <!-- Card 2: Pengambilan Almamater -->
        <button onclick="selectService('Pengambilan Almamater', 'ALM')" class="w-full text-left bg-slate-800 border border-slate-700 rounded-lg p-5 shadow-sm hover:bg-slate-700 transition-colors duration-200 group flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-blue-900/50 flex items-center justify-center text-blue-500 group-hover:bg-blue-600 group-hover:text-white transition-colors duration-200">
                    <i data-lucide="shirt"></i>
                </div>
                <div>
                    <h2 class="text-lg font-medium text-slate-100">Pengambilan Almamater</h2>
                    <p class="text-sm text-slate-400 mt-0.5">Jas Almamater Kampus</p>
                </div>
            </div>
            <i data-lucide="chevron-right" class="text-slate-500 group-hover:text-slate-300"></i>
        </button>

    </main>

    <!-- Footer -->
    <footer class="p-6 text-center text-slate-500 text-xs">
        &copy; 2026 Enterprise Student Queue System
    </footer>

    <script>
        lucide.createIcons();

        function selectService(serviceName, serviceCode) {
            localStorage.setItem('selected_service_name', serviceName);
            localStorage.setItem('selected_service_code', serviceCode);
            window.location.href = 'register.html';
        }
    </script>
</body>
</html>
