<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Student Queue System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-900 text-slate-100 h-screen w-screen overflow-hidden flex flex-col antialiased relative">
    
    <!-- Running Text (Paling Atas) -->
    <div class="bg-blue-800 text-blue-50 py-3 text-lg font-medium tracking-wider marquee-container border-b border-blue-900 shrink-0 z-10">
        <div class="marquee-content">
            SELAMAT DATANG DI ENTERPRISE STUDENT QUEUE SYSTEM. HARAP MEMPERSIAPKAN KARTU IDENTITAS ANDA SEBELUM MENUJU LOKET. TETAP JAGA KETERTIBAN DAN KEAMANAN BERSAMA.
        </div>
    </div>

    <!-- Admin Portal Button -->
    <button onclick="QueueSystem.navigate('admin-login.html')" class="absolute top-16 right-6 flex items-center gap-2 text-slate-400 hover:text-white transition-colors z-20 bg-slate-800/80 px-4 py-2 rounded-lg border border-slate-700 shadow-sm">
        <span class="text-sm font-medium">Admin Portal</span>
        <i data-lucide="user-cog" class="w-5 h-5"></i>
    </button>

    <div class="flex-1 flex flex-row overflow-hidden relative">
        
        <!-- Main Queue Display (Kiri/Tengah) -->
        <main class="flex-1 flex flex-col items-center justify-center p-12 relative">
            <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-800/50 via-slate-900 to-slate-900 pointer-events-none"></div>
            
            <div class="z-10 flex flex-col items-center justify-center text-center w-full max-w-4xl bg-slate-800/80 backdrop-blur-sm border border-slate-700 p-16 rounded-3xl shadow-2xl">
                <h2 class="text-3xl text-slate-400 font-medium uppercase tracking-[0.2em] mb-4">NOMOR ANTREAN DIPANGGIL</h2>
                <div id="current-number" class="text-[12rem] font-black text-blue-500 leading-none tracking-tight my-8 drop-shadow-lg">
                    --
                </div>
                <div class="flex items-center gap-4 bg-slate-900/50 px-8 py-4 rounded-2xl border border-slate-700/50">
                    <p class="text-3xl text-slate-300 font-medium capitalize" id="current-name">Menunggu Antrean...</p>
                    <div class="w-2 h-2 rounded-full bg-slate-600"></div>
                    <p class="text-2xl text-blue-400 font-semibold uppercase tracking-wide" id="current-service">Layanan</p>
                </div>
            </div>
        </main>

        <!-- Sidebar Kanan: Aksi & Riwayat -->
        <aside class="w-[450px] bg-slate-800 border-l border-slate-700 flex flex-col shrink-0 z-10 shadow-[-10px_0_30px_rgba(0,0,0,0.5)]">
            
            <!-- Ambil Antrean Section -->
            <div class="p-6 border-b border-slate-700 bg-slate-800/80 mt-12">
                <h3 class="text-xl font-bold text-slate-200 tracking-wide flex items-center gap-3 mb-4">
                    <i data-lucide="hand" class="text-blue-500"></i>
                    Ambil Antrean
                </h3>
                
                <div class="flex flex-col gap-3">
                    <button onclick="selectService('Pengambilan KPM', 'KPM')" class="w-full text-left bg-slate-900 border border-slate-600 rounded-lg p-4 shadow-sm hover:bg-slate-700 transition-colors duration-200 group flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-blue-900/50 flex items-center justify-center text-blue-500 group-hover:bg-blue-600 group-hover:text-white transition-colors duration-200">
                                <i data-lucide="credit-card" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <h2 class="font-medium text-slate-100">Pengambilan KPM</h2>
                                <p class="text-xs text-slate-400 mt-0.5">Kartu Tanda Mahasiswa</p>
                            </div>
                        </div>
                        <i data-lucide="chevron-right" class="text-slate-500 group-hover:text-slate-300"></i>
                    </button>

                    <button onclick="selectService('Pengambilan Almamater', 'ALM')" class="w-full text-left bg-slate-900 border border-slate-600 rounded-lg p-4 shadow-sm hover:bg-slate-700 transition-colors duration-200 group flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-blue-900/50 flex items-center justify-center text-blue-500 group-hover:bg-blue-600 group-hover:text-white transition-colors duration-200">
                                <i data-lucide="shirt" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <h2 class="font-medium text-slate-100">Ambil Almamater</h2>
                                <p class="text-xs text-slate-400 mt-0.5">Jas Almamater Kampus</p>
                            </div>
                        </div>
                        <i data-lucide="chevron-right" class="text-slate-500 group-hover:text-slate-300"></i>
                    </button>
                </div>
            </div>

            <!-- History Section -->
            <div class="flex-1 flex flex-col overflow-hidden">
                <div class="p-6 pb-2 border-b border-slate-700/50 bg-slate-800/50 flex justify-between items-center">
                    <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                        <i data-lucide="history" class="w-4 h-4"></i>
                        Riwayat Panggilan
                    </h3>
                </div>
                
                <div id="history-list" class="flex-1 flex flex-col p-6 gap-3 overflow-y-auto">
                    <!-- Template for history item rendered by JS -->
                </div>
            </div>

            <!-- Cek Status Saya (Optional utility since it's now an all-in-one screen, but user requested back buttons etc., so we keep it) -->
            <div class="p-6 border-t border-slate-700 bg-slate-800/80">
                <button onclick="QueueSystem.navigate('ticket-waiting.html')" class="w-full py-2.5 bg-blue-900/40 hover:bg-blue-900/60 text-blue-400 border border-blue-800/50 rounded-lg text-sm font-medium transition-colors flex items-center justify-center gap-2">
                    <i data-lucide="ticket" class="w-4 h-4"></i> Cek Status Antrean Saya
                </button>
            </div>

        </aside>

    </div>

    <script src="assets/js/app.js"></script>
    <script>
        lucide.createIcons();

        function selectService(serviceName, serviceCode) {
            localStorage.setItem('selected_service_name', serviceName);
            localStorage.setItem('selected_service_code', serviceCode);
            QueueSystem.navigate('register.html');
        }

        function updateMonitor() {
            const queues = QueueSystem.getQueues();
            
            // Find currently called ticket
            const calledTicket = queues.find(q => q.status === 'called');
            
            if (calledTicket) {
                document.getElementById('current-number').textContent = calledTicket.ticketNumber;
                document.getElementById('current-name').textContent = calledTicket.name;
                document.getElementById('current-service').textContent = calledTicket.serviceName;
                document.getElementById('current-number').classList.add('animate-pulse');
            } else {
                document.getElementById('current-number').textContent = '--';
                document.getElementById('current-name').textContent = 'Menunggu Antrean...';
                document.getElementById('current-service').textContent = 'Layanan';
                document.getElementById('current-number').classList.remove('animate-pulse');
            }

            // History: Last 3 completed or missed
            const history = queues.filter(q => q.status === 'completed' || q.status === 'missed')
                                  .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))
                                  .slice(0, 3);
            
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';

            if (history.length === 0) {
                historyList.innerHTML = `<div class="text-center text-slate-500 text-sm mt-4">Belum ada riwayat</div>`;
            }

            history.forEach(ticket => {
                const isCompleted = ticket.status === 'completed';
                const statusColor = isCompleted ? 'text-green-400' : 'text-red-400';
                const statusIcon = isCompleted ? 'check' : 'x';
                const statusText = isCompleted ? 'Selesai' : 'Terlewat';

                historyList.innerHTML += `
                    <div class="bg-slate-900 border border-slate-700 rounded-xl p-4 shadow-sm flex items-center justify-between transition-all">
                        <div>
                            <div class="text-xs text-slate-400 mb-1">${ticket.serviceName}</div>
                            <div class="text-lg font-bold text-slate-200">${ticket.ticketNumber}</div>
                        </div>
                        <div class="text-right">
                            <div class="text-xs ${statusColor} font-medium flex items-center justify-end gap-1">
                                <i data-lucide="${statusIcon}" class="w-3 h-3"></i> ${statusText}
                            </div>
                        </div>
                    </div>
                `;
            });

            // Re-initialize icons for dynamically added HTML
            lucide.createIcons();
        }

        updateMonitor();
        setInterval(updateMonitor, 1000);
    </script>
</body>
</html>
