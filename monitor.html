<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Antrean - Enterprise Student Queue System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .marquee-container {
            overflow: hidden;
            white-space: nowrap;
        }
        .marquee-content {
            display: inline-block;
            animation: marquee 20s linear infinite;
        }
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen w-screen overflow-hidden flex flex-col antialiased">
    
    <!-- Running Text (Paling Atas) -->
    <div class="bg-blue-800 text-blue-50 py-3 text-lg font-medium tracking-wider marquee-container border-b border-blue-900 shrink-0">
        <div class="marquee-content">
            SELAMAT DATANG DI ENTERPRISE STUDENT QUEUE SYSTEM. HARAP MEMPERSIAPKAN KARTU IDENTITAS ANDA SEBELUM MENUJU LOKET. TETAP JAGA KETERTIBAN DAN KEAMANAN BERSAMA.
        </div>
    </div>

    <div class="flex-1 flex flex-row overflow-hidden">
        
        <!-- Main Queue Display (Tengah/Kiri) -->
        <main class="flex-1 flex flex-col items-center justify-center p-12 relative">
            <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-800/50 via-slate-900 to-slate-900 pointer-events-none"></div>
            
            <div class="z-10 flex flex-col items-center justify-center text-center w-full max-w-4xl bg-slate-800/80 backdrop-blur-sm border border-slate-700 p-16 rounded-3xl shadow-2xl">
                <h2 class="text-3xl text-slate-400 font-medium uppercase tracking-[0.2em] mb-4">NOMOR ANTREAN DIPANGGIL</h2>
                <div id="current-number" class="text-[12rem] font-black text-blue-500 leading-none tracking-tight my-8 drop-shadow-lg">
                    --
                </div>
                <div class="flex items-center gap-4 bg-slate-900/50 px-8 py-4 rounded-2xl border border-slate-700/50">
                    <p class="text-3xl text-slate-300 font-medium capitalize" id="current-name">Menunggu Antrean...</p>
                    <div class="w-2 h-2 rounded-full bg-slate-600"></div>
                    <p class="text-2xl text-blue-400 font-semibold uppercase tracking-wide" id="current-service">Layanan</p>
                </div>
            </div>
        </main>

        <!-- Sidebar: 3 Antrean Terakhir -->
        <aside class="w-[450px] bg-slate-800 border-l border-slate-700 flex flex-col shrink-0">
            <div class="p-8 border-b border-slate-700 bg-slate-800/50">
                <h3 class="text-xl font-bold text-slate-200 tracking-wide flex items-center gap-3">
                    <i data-lucide="history" class="text-blue-500"></i>
                    Riwayat Panggilan
                </h3>
            </div>
            
            <div id="history-list" class="flex-1 flex flex-col p-6 gap-4 overflow-hidden">
                <!-- Template for history item -->
                <!--
                <div class="bg-slate-900 border border-slate-700 rounded-xl p-6 shadow-sm flex items-center justify-between">
                    <div>
                        <div class="text-sm text-slate-400 mb-1">Pengambilan KPM</div>
                        <div class="text-xl font-bold text-slate-200">KPM-001</div>
                    </div>
                    <div class="text-right">
                        <div class="text-sm text-green-400 font-medium flex items-center justify-end gap-1"><i data-lucide="check" class="w-4 h-4"></i> Selesai</div>
                    </div>
                </div>
                -->
            </div>

            <!-- Footer Logo -->
            <div class="p-8 border-t border-slate-700 text-center flex flex-col items-center justify-center gap-2">
                <i data-lucide="layers" class="w-8 h-8 text-blue-600"></i>
                <div class="text-slate-500 text-sm font-semibold tracking-widest">ZENITH QUEUE</div>
            </div>
        </aside>

    </div>

    <script>
        lucide.createIcons();

        function updateMonitor() {
            const queues = JSON.parse(localStorage.getItem('system_queues')) || [];
            
            // Find currently called ticket
            const calledTicket = queues.find(q => q.status === 'called');
            
            if (calledTicket) {
                document.getElementById('current-number').textContent = calledTicket.ticketNumber;
                document.getElementById('current-name').textContent = calledTicket.name;
                document.getElementById('current-service').textContent = calledTicket.serviceName;
                document.getElementById('current-number').classList.add('animate-pulse');
            } else {
                document.getElementById('current-number').textContent = '--';
                document.getElementById('current-name').textContent = 'Menunggu Antrean...';
                document.getElementById('current-service').textContent = 'Layanan';
                document.getElementById('current-number').classList.remove('animate-pulse');
            }

            // History: Last 3 completed or missed
            const history = queues.filter(q => q.status === 'completed' || q.status === 'missed')
                                  .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))
                                  .slice(0, 3);
            
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';

            history.forEach(ticket => {
                const isCompleted = ticket.status === 'completed';
                const statusColor = isCompleted ? 'text-green-400' : 'text-red-400';
                const statusIcon = isCompleted ? 'check' : 'x';
                const statusText = isCompleted ? 'Selesai' : 'Terlewat';

                historyList.innerHTML += `
                    <div class="bg-slate-900 border border-slate-700 rounded-xl p-6 shadow-sm flex items-center justify-between transition-all">
                        <div>
                            <div class="text-sm text-slate-400 mb-1">${ticket.serviceName}</div>
                            <div class="text-2xl font-bold text-slate-200">${ticket.ticketNumber}</div>
                        </div>
                        <div class="text-right">
                            <div class="text-sm ${statusColor} font-medium flex items-center justify-end gap-1">
                                <i data-lucide="${statusIcon}" class="w-4 h-4"></i> ${statusText}
                            </div>
                        </div>
                    </div>
                `;
            });

            // Re-initialize icons for dynamically added HTML
            lucide.createIcons();
        }

        updateMonitor();
        setInterval(updateMonitor, 1000);
    </script>
</body>
</html>
