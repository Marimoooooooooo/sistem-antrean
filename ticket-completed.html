<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selesai - Enterprise Student Queue System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col antialiased items-center justify-center p-6">
    
    <div class="w-full max-w-sm bg-slate-800 border border-slate-700 rounded-xl shadow-sm p-8 text-center flex flex-col items-center">
        
        <div class="w-24 h-24 bg-green-900/30 text-green-500 rounded-full flex items-center justify-center mb-6">
            <i data-lucide="check-circle-2" class="w-12 h-12"></i>
        </div>

        <h1 class="text-2xl font-bold text-slate-100 mb-2">Pelayanan Selesai</h1>
        <p class="text-slate-400 text-sm mb-8 leading-relaxed">
            Terima kasih telah menggunakan layanan kami. Semoga hari Anda menyenangkan!
        </p>

        <button onclick="window.location.href='feedback.html'" class="w-full bg-blue-700 hover:bg-blue-600 text-white font-medium py-3 px-4 rounded-lg transition-colors shadow-sm flex items-center justify-center gap-2">
            <i data-lucide="message-square-heart" class="w-4 h-4"></i>
            Berikan Penilaian
        </button>

        <button onclick="newQueue()" class="w-full mt-3 bg-transparent hover:bg-slate-700/50 text-slate-400 font-medium py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 text-sm">
            Kembali ke Beranda
        </button>

    </div>

    <script>
        lucide.createIcons();

        function newQueue() {
            localStorage.removeItem('current_user_ticket');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
