<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waktu Habis - Enterprise Student Queue System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col antialiased items-center justify-center p-6">
    
    <div class="w-full max-w-sm bg-slate-800 border border-slate-700 rounded-xl shadow-sm p-8 text-center flex flex-col items-center">
        
        <div class="w-20 h-20 bg-red-900/30 text-red-500 rounded-full flex items-center justify-center mb-6">
            <i data-lucide="clock-4" class="w-10 h-10"></i>
        </div>

        <h1 class="text-2xl font-bold text-slate-100 mb-2 uppercase tracking-wide">MAAF, WAKTU ANDA HABIS</h1>
        <p class="text-slate-400 text-sm mb-8 leading-relaxed">
            Nomor antrean Anda telah terlewat karena melebihi batas waktu panggilan (3 Menit). Silakan mengambil nomor antrean baru.
        </p>

        <button onclick="newQueue()" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-medium py-3 px-4 rounded-lg transition-colors shadow-sm flex items-center justify-center gap-2">
            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
            Ambil Antrean Baru
        </button>

    </div>

    <script>
        lucide.createIcons();

        function newQueue() {
            localStorage.removeItem('current_user_ticket');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
