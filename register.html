<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Antrean - Enterprise Student Queue System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col antialiased">
    
    <!-- Header -->
    <header class="p-6 bg-slate-900 border-b border-slate-700 sticky top-0 z-10 shadow-sm flex items-center">
        <button onclick="window.location.href='index.html'" class="text-slate-400 hover:text-white transition-colors">
            <i data-lucide="arrow-left"></i>
        </button>
        <div class="flex-1 text-center pr-6">
            <h1 class="text-xl font-semibold tracking-wide">Data Diri</h1>
            <p id="service-title" class="text-slate-400 text-sm mt-1">Layanan</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-6 flex flex-col max-w-md mx-auto w-full">
        
        <form id="register-form" class="bg-slate-800 border border-slate-700 rounded-lg p-6 shadow-sm flex flex-col gap-5">
            
            <div class="flex flex-col gap-2">
                <label for="name" class="text-sm font-medium text-slate-300">Nama Lengkap</label>
                <input type="text" id="name" required placeholder="Masukkan nama lengkap Anda" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-slate-100 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder-slate-500">
            </div>

            <div class="flex flex-col gap-2">
                <label for="phone" class="text-sm font-medium text-slate-300">Nomor Handphone (WhatsApp)</label>
                <input type="tel" id="phone" required placeholder="08xxxxxxxxxx" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-slate-100 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder-slate-500">
            </div>

            <button type="submit" class="w-full bg-blue-700 hover:bg-blue-600 text-white font-medium py-3 px-4 rounded-lg transition-colors mt-2 shadow-sm">
                Daftar Antrean
            </button>
            
        </form>

    </main>

    <script src="assets/js/app.js"></script>
    <script>
        lucide.createIcons();

        const serviceName = localStorage.getItem('selected_service_name') || 'Layanan';
        const serviceCode = localStorage.getItem('selected_service_code') || 'SRV';
        
        document.getElementById('service-title').textContent = serviceName;

        document.getElementById('register-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            
            if(!name || !phone) return;

            // Generate ticket data
            let queues = QueueSystem.getQueues();
            
            // Filter by service to get current queue number
            const serviceQueues = queues.filter(q => q.serviceCode === serviceCode);
            const nextNumber = serviceQueues.length + 1;
            const ticketNumber = `${serviceCode}-${nextNumber.toString().padStart(3, '0')}`;
            
            const newTicket = {
                id: 'tkt_' + Date.now().toString(36) + Math.random().toString(36).substr(2),
                ticketNumber: ticketNumber,
                name: name,
                phone: phone,
                serviceName: serviceName,
                serviceCode: serviceCode,
                status: 'waiting', // waiting, called, completed, missed
                timestamp: new Date().toISOString(),
                calledAt: null
            };

            queues.push(newTicket);
            QueueSystem.saveQueues(queues);
            QueueSystem.setCurrentTicketId(newTicket.id);
            
            QueueSystem.navigate('ticket-generated.html');
        });
    </script>
</body>
</html>
