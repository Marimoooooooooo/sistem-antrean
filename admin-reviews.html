<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Ulasan - Enterprise Student Queue System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex overflow-hidden antialiased">
    
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-800 border-r border-slate-700 flex flex-col">
        <div class="h-16 flex items-center px-6 border-b border-slate-700">
            <i data-lucide="layers" class="w-6 h-6 text-blue-500 mr-3"></i>
            <span class="font-bold tracking-wider text-slate-100">ZENITH<span class="text-blue-500">QUEUE</span></span>
        </div>
        
        <nav class="flex-1 p-4 flex flex-col gap-2">
            <a href="admin-dashboard.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-slate-200 hover:bg-slate-700/50 rounded-lg font-medium transition-colors">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
            </a>
            <a href="admin-analytics.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-slate-200 hover:bg-slate-700/50 rounded-lg font-medium transition-colors">
                <i data-lucide="bar-chart-3" class="w-5 h-5"></i> Laporan
            </a>
            <a href="admin-reviews.html" class="flex items-center gap-3 px-4 py-3 bg-blue-900/40 text-blue-400 rounded-lg font-medium border border-blue-800/50">
                <i data-lucide="star" class="w-5 h-5"></i> Ulasan
            </a>
            <a href="admin-settings.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-slate-200 hover:bg-slate-700/50 rounded-lg font-medium transition-colors">
                <i data-lucide="settings" class="w-5 h-5"></i> Pengaturan
            </a>
        </nav>

        <div class="p-4 border-t border-slate-700">
            <a href="index.html" class="flex items-center gap-3 px-4 py-3 text-red-400 hover:bg-red-900/20 rounded-lg font-medium transition-colors w-full">
                <i data-lucide="log-out" class="w-5 h-5"></i> Keluar
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        
        <!-- Topbar -->
        <header class="h-16 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-8 shrink-0">
            <h1 class="text-xl font-semibold">Ulasan Pengguna</h1>
            <div class="flex items-center gap-4">
                <div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-sm font-medium border border-slate-600">
                    AD
                </div>
            </div>
        </header>

        <!-- Content Area -->
        <div class="flex-1 p-8 overflow-y-auto">
            
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-medium text-slate-200 flex items-center gap-2">
                    <i data-lucide="message-square" class="w-5 h-5 text-blue-500"></i>
                    Daftar Ulasan & Penilaian
                </h2>
                <button onclick="clearReviews()" class="text-sm px-3 py-1.5 text-slate-400 border border-slate-600 rounded hover:bg-slate-700 transition-colors">
                    Hapus Semua Ulasan
                </button>
            </div>

            <!-- Reviews Grid -->
            <div id="reviews-container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                <!-- Reviews populated by JS -->
            </div>

        </div>

    </main>

    <script src="assets/js/app.js"></script>
    <script>
        lucide.createIcons();

        function renderReviews() {
            const feedbacks = QueueSystem.getFeedbacks();
            const container = document.getElementById('reviews-container');
            container.innerHTML = '';

            if(feedbacks.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full p-12 flex flex-col items-center justify-center text-slate-500 bg-slate-800/50 border border-slate-700 rounded-xl border-dashed">
                        <i data-lucide="message-square-off" class="w-12 h-12 mb-4 text-slate-600"></i>
                        <p>Belum ada ulasan yang masuk.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            // Sort feedbacks by timestamp descending
            feedbacks.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

            feedbacks.forEach(fb => {
                const date = new Date(fb.timestamp);
                const formattedDate = date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });

                let starsHtml = '';
                for(let i=1; i<=5; i++) {
                    if(i <= fb.rating) {
                        starsHtml += `<i data-lucide="star" class="w-4 h-4 text-amber-400 fill-current"></i>`;
                    } else {
                        starsHtml += `<i data-lucide="star" class="w-4 h-4 text-slate-600"></i>`;
                    }
                }

                const div = document.createElement('div');
                div.className = 'bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-sm flex flex-col gap-4';
                div.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="font-medium text-slate-200">${fb.name}</h3>
                            <p class="text-xs text-slate-400 mt-1">${fb.ticketNumber} • ${fb.serviceName}</p>
                        </div>
                        <div class="flex gap-1">
                            ${starsHtml}
                        </div>
                    </div>
                    <div class="flex-1 bg-slate-900/50 rounded-lg p-4 border border-slate-700/50">
                        <p class="text-sm text-slate-300 italic">"${fb.review ? fb.review : 'Tidak ada ulasan tertulis.'}"</p>
                    </div>
                    <div class="text-xs text-slate-500 text-right">
                        ${formattedDate}
                    </div>
                `;
                container.appendChild(div);
            });

            lucide.createIcons();
        }

        function clearReviews() {
            if(confirm('Hapus semua ulasan?')) {
                QueueSystem.saveFeedbacks([]);
                renderReviews();
            }
        }

        renderReviews();
    </script>
</body>
</html>
