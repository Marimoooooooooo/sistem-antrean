<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiket Berhasil - Enterprise Student Queue System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col antialiased items-center justify-center p-6 relative">
    
    <div class="w-full max-w-sm bg-slate-800 border border-slate-700 rounded-lg shadow-sm overflow-hidden flex flex-col text-center relative">
        
        <div class="bg-green-900/30 text-green-400 text-sm font-medium py-3 px-4 border-b border-slate-700 flex items-center justify-center gap-2">
            <i data-lucide="check-circle-2" class="w-5 h-5"></i>
            Tiket Berhasil Dibuat
        </div>

        <div class="p-8 flex flex-col items-center">
            <h2 id="service-name" class="text-sm text-slate-400 font-medium mb-1">Layanan</h2>
            <div id="ticket-number" class="text-5xl font-bold text-slate-100 my-4 tracking-tight">--</div>
            <p id="user-name" class="text-lg text-slate-300 font-medium capitalize">--</p>
        </div>

        <div class="bg-slate-900 border-t border-slate-700 p-6 flex flex-col gap-3">
            <button onclick="alert('Mencetak tiket...')" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-medium py-3 px-4 rounded-lg transition-colors shadow-sm flex justify-center items-center gap-2">
                <i data-lucide="printer" class="w-4 h-4"></i> Cetak Tiket
            </button>
            
            <button onclick="QueueSystem.navigate('index.html')" class="w-full bg-slate-800 border border-slate-600 hover:bg-slate-700 text-slate-300 font-medium py-3 px-4 rounded-lg transition-colors flex justify-center items-center gap-2">
                <i data-lucide="info" class="w-4 h-4"></i> Lihat Info (Monitor Layar)
            </button>
            
            <button onclick="QueueSystem.navigate('ticket-waiting.html')" class="w-full mt-2 text-sm text-blue-400 hover:text-blue-300 transition-colors underline">
                Cek Status Antrean Live Saya
            </button>
        </div>

    </div>

    <script src="assets/js/app.js"></script>
    <script>
        lucide.createIcons();

        const ticketId = QueueSystem.getCurrentTicketId();
        if(!ticketId) QueueSystem.navigate('index.html');

        const queues = QueueSystem.getQueues();
        const ticket = queues.find(q => q.id === ticketId);

        if(!ticket) {
            QueueSystem.navigate('index.html');
        } else {
            document.getElementById('service-name').textContent = ticket.serviceName;
            document.getElementById('ticket-number').textContent = ticket.ticketNumber;
            document.getElementById('user-name').textContent = ticket.name;
        }
    </script>
</body>
</html>
