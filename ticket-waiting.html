<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Tiket Antrean - Enterprise Student Queue System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col antialiased items-center justify-center p-6 relative">
    
    <!-- Tombol Kembali -->
    <button onclick="QueueSystem.navigate('ticket-generated.html')" class="absolute top-6 left-6 text-slate-400 hover:text-white transition-colors flex items-center gap-2 z-20">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
        <span class="text-sm font-medium">Kembali</span>
    </button>

    <div class="w-full max-w-sm bg-slate-800 border border-slate-700 rounded-lg shadow-sm overflow-hidden flex flex-col text-center relative">
        
        <!-- Header Ribbon -->
        <div class="bg-blue-900/30 text-blue-400 text-xs font-semibold py-2 px-4 uppercase tracking-wider border-b border-slate-700">
            E-Tiket Aktif
        </div>

        <div class="p-8 flex flex-col items-center">
            <h2 id="service-name" class="text-sm text-slate-400 font-medium mb-1">Layanan</h2>
            <div id="ticket-number" class="text-5xl font-bold text-slate-100 my-4 tracking-tight">--</div>
            <p id="user-name" class="text-lg text-slate-300 font-medium capitalize">--</p>
        </div>

        <div class="bg-slate-900 border-t border-slate-700 p-6 flex flex-col gap-4 text-sm">
            <div class="flex justify-between items-center text-slate-400">
                <span>Status</span>
                <span class="px-3 py-1 bg-amber-900/40 text-amber-500 rounded-full text-xs font-semibold flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                    Menunggu
                </span>
            </div>
            <div class="flex justify-between items-center text-slate-400 border-t border-slate-800 pt-3">
                <span>Estimasi Waktu</span>
                <span class="text-slate-200 font-medium">~ 15 Menit</span>
            </div>
        </div>

        <!-- Perforation holes visual -->
        <div class="absolute left-0 right-0 bottom-[116px] flex justify-between px-[-8px]">
            <div class="w-4 h-4 bg-slate-900 rounded-full transform -translate-x-1/2"></div>
            <div class="w-4 h-4 bg-slate-900 rounded-full transform translate-x-1/2"></div>
        </div>
    </div>

    <p class="text-slate-500 text-sm mt-8 text-center max-w-xs">
        Mohon bersiap di area tunggu. Layar ini akan otomatis berubah saat nomor Anda dipanggil.
    </p>

    <script src="assets/js/app.js"></script>
    <script>
        lucide.createIcons();

        const ticketId = QueueSystem.getCurrentTicketId();
        if(!ticketId) QueueSystem.navigate('index.html');

        function checkStatus() {
            const queues = QueueSystem.getQueues();
            const ticket = queues.find(q => q.id === ticketId);

            if(!ticket) {
                QueueSystem.navigate('index.html');
                return;
            }

            document.getElementById('service-name').textContent = ticket.serviceName;
            document.getElementById('ticket-number').textContent = ticket.ticketNumber;
            document.getElementById('user-name').textContent = ticket.name;

            if(ticket.status === 'called') {
                QueueSystem.navigate('ticket-called.html');
            } else if (ticket.status === 'missed') {
                QueueSystem.navigate('ticket-missed.html');
            } else if (ticket.status === 'completed') {
                QueueSystem.navigate('ticket-completed.html');
            }
        }

        // Check immediately then poll every 1 second
        checkStatus();
        setInterval(checkStatus, 1000);
    </script>
</body>
</html>
