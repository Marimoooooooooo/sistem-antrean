<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Enterprise Student Queue System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex overflow-hidden antialiased">
    
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-800 border-r border-slate-700 flex flex-col">
        <div class="h-16 flex items-center px-6 border-b border-slate-700">
            <i data-lucide="layers" class="w-6 h-6 text-blue-500 mr-3"></i>
            <span class="font-bold tracking-wider text-slate-100">ZENITH<span class="text-blue-500">QUEUE</span></span>
        </div>
        
        <nav class="flex-1 p-4 flex flex-col gap-2">
            <a href="admin-dashboard.html" class="flex items-center gap-3 px-4 py-3 bg-blue-900/40 text-blue-400 rounded-lg font-medium border border-blue-800/50">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
            </a>
            <a href="admin-analytics.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-slate-200 hover:bg-slate-700/50 rounded-lg font-medium transition-colors">
                <i data-lucide="bar-chart-3" class="w-5 h-5"></i> Laporan
            </a>
            <a href="admin-reviews.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-slate-200 hover:bg-slate-700/50 rounded-lg font-medium transition-colors">
                <i data-lucide="star" class="w-5 h-5"></i> Ulasan
            </a>
            <a href="admin-settings.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-slate-200 hover:bg-slate-700/50 rounded-lg font-medium transition-colors">
                <i data-lucide="settings" class="w-5 h-5"></i> Pengaturan
            </a>
        </nav>

        <div class="p-4 border-t border-slate-700">
            <a href="index.html" class="flex items-center gap-3 px-4 py-3 text-red-400 hover:bg-red-900/20 rounded-lg font-medium transition-colors w-full">
                <i data-lucide="log-out" class="w-5 h-5"></i> Keluar
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        
        <!-- Topbar -->
        <header class="h-16 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-8 shrink-0">
            <h1 class="text-xl font-semibold">Tabel Antrean Aktif</h1>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 text-sm text-slate-400">
                    <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                    Sistem Aktif
                </div>
                <div class="h-6 w-px bg-slate-700 mx-2"></div>
                <div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-sm font-medium border border-slate-600">
                    AD
                </div>
            </div>
        </header>

        <!-- Content Area -->
        <div class="flex-1 p-8 overflow-y-auto">
            
            <div class="bg-slate-800 border border-slate-700 rounded-xl shadow-sm overflow-hidden flex flex-col max-h-full">
                
                <div class="p-5 border-b border-slate-700 flex justify-between items-center bg-slate-800/50">
                    <h2 class="font-medium text-slate-200 flex items-center gap-2">
                        <i data-lucide="users" class="w-5 h-5 text-blue-500"></i>
                        Daftar Antrean Hari Ini
                    </h2>
                    <button onclick="clearAll()" class="text-sm px-3 py-1.5 text-slate-400 border border-slate-600 rounded hover:bg-slate-700 transition-colors">
                        Reset Data (Testing)
                    </button>
                </div>

                <div class="overflow-x-auto flex-1">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-900/50 text-slate-400 text-xs uppercase tracking-wider">
                                <th class="p-4 font-medium border-b border-slate-700">No. Antrean</th>
                                <th class="p-4 font-medium border-b border-slate-700">Nama Lengkap</th>
                                <th class="p-4 font-medium border-b border-slate-700">Layanan</th>
                                <th class="p-4 font-medium border-b border-slate-700">Status & Timer</th>
                                <th class="p-4 font-medium border-b border-slate-700 text-right">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="table-body" class="text-sm divide-y divide-slate-700/50">
                            <!-- Rows rendered by JS -->
                        </tbody>
                    </table>
                </div>
                
            </div>

        </div>

    </main>

    <script src="assets/js/app.js"></script>
    <script>
        lucide.createIcons();

        function renderTable() {
            const queues = QueueSystem.getQueues();
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            if(queues.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-500">Tidak ada antrean aktif saat ini.</td></tr>`;
                return;
            }

            // Only show waiting or called
            const activeQueues = queues.filter(q => q.status === 'waiting' || q.status === 'called');

            if(activeQueues.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-500">Semua antrean telah selesai/terlewat.</td></tr>`;
                return;
            }

            activeQueues.forEach(ticket => {
                const tr = document.createElement('tr');
                tr.className = ticket.status === 'called' ? 'bg-blue-900/10' : 'hover:bg-slate-800/80';
                
                let statusBadge = '';
                let actionButtons = '';

                if (ticket.status === 'waiting') {
                    // Calculate wait time
                    const waitMins = Math.floor((new Date() - new Date(ticket.timestamp)) / 60000);
                    statusBadge = `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-slate-700 text-slate-300 border border-slate-600"><i data-lucide="clock" class="w-3 h-3"></i> Menunggu (${waitMins}m)</span>`;
                    
                    const isAnyCalled = queues.some(q => q.status === 'called');
                    if (isAnyCalled) {
                        actionButtons = `<button disabled class="px-3 py-1.5 bg-slate-700 text-slate-400 rounded-lg text-xs font-medium cursor-not-allowed border border-slate-600">Panggil</button>`;
                    } else {
                        actionButtons = `<button onclick="callTicket('${ticket.id}')" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-medium transition-colors shadow-sm">Panggil</button>`;
                    }
                    actionButtons += `<button onclick="skipTicket('${ticket.id}')" class="ml-2 px-3 py-1.5 bg-transparent border border-slate-600 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-medium transition-colors">Lewati</button>`;

                } else if (ticket.status === 'called') {
                    // Timer logic handled dynamically below, placeholder here
                    statusBadge = `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-blue-900 text-blue-300 border border-blue-700"><span class="w-1.5 h-1.5 rounded-full bg-blue-400 animate-pulse"></span> Dipanggil <span id="timer-${ticket.id}" class="font-mono">--:--</span></span>`;
                    
                    actionButtons = `<button onclick="completeTicket('${ticket.id}')" class="px-3 py-1.5 bg-green-600 hover:bg-green-500 text-white rounded-lg text-xs font-medium transition-colors shadow-sm">Selesai</button>`;
                    actionButtons += `<button onclick="skipTicket('${ticket.id}')" class="ml-2 px-3 py-1.5 bg-transparent border border-red-900/50 hover:bg-red-900/30 text-red-400 rounded-lg text-xs font-medium transition-colors">Lewati (Miss)</button>`;
                }

                tr.innerHTML = `
                    <td class="p-4 font-semibold text-slate-200">${ticket.ticketNumber}</td>
                    <td class="p-4 text-slate-300">${ticket.name}<br><span class="text-xs text-slate-500">${ticket.phone}</span></td>
                    <td class="p-4 text-slate-300">${ticket.serviceName}</td>
                    <td class="p-4">${statusBadge}</td>
                    <td class="p-4 text-right">${actionButtons}</td>
                `;
                tbody.appendChild(tr);
            });

            lucide.createIcons();
            updateTimers();
        }

        function updateTimers() {
            const queues = QueueSystem.getQueues();
            queues.forEach((ticket, index) => {
                if(ticket.status === 'called' && ticket.calledAt) {
                    const el = document.getElementById(`timer-${ticket.id}`);
                    if(el) {
                        const diffSecs = Math.floor((new Date().getTime() - new Date(ticket.calledAt).getTime()) / 1000);
                        const remaining = 180 - diffSecs; // 3 mins

                        if (remaining <= 0) {
                            skipTicket(ticket.id); // auto skip
                        } else {
                            const m = Math.floor(remaining / 60).toString().padStart(2, '0');
                            const s = (remaining % 60).toString().padStart(2, '0');
                            el.textContent = `(${m}:${s})`;
                            if(remaining < 30) {
                                el.parentElement.classList.replace('bg-blue-900', 'bg-red-900');
                                el.parentElement.classList.replace('text-blue-300', 'text-red-300');
                                el.parentElement.classList.replace('border-blue-700', 'border-red-700');
                            }
                        }
                    }
                }
            });
        }

        function callTicket(id) {
            let queues = QueueSystem.getQueues();
            let index = queues.findIndex(q => q.id === id);
            if(index > -1) {
                queues[index].status = 'called';
                queues[index].calledAt = new Date().toISOString();
                QueueSystem.saveQueues(queues);
                renderTable();
            }
        }

        function completeTicket(id) {
            let queues = QueueSystem.getQueues();
            let index = queues.findIndex(q => q.id === id);
            if(index > -1) {
                queues[index].status = 'completed';
                QueueSystem.saveQueues(queues);
                renderTable();
            }
        }

        function skipTicket(id) {
            let queues = QueueSystem.getQueues();
            let index = queues.findIndex(q => q.id === id);
            if(index > -1) {
                queues[index].status = 'missed';
                QueueSystem.saveQueues(queues);
                renderTable();
            }
        }

        function clearAll() {
            if(confirm('Hapus semua antrean saat ini?')) {
                QueueSystem.saveQueues([]);
                renderTable();
            }
        }

        renderTable();
        setInterval(renderTable, 1000); // Re-render every second to update wait times and timers
    </script>
</body>
</html>
