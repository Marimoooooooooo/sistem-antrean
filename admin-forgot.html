<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - Enterprise Student Queue System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-6 antialiased relative overflow-hidden">
    
    <!-- Background Decor -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-900/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-xl shadow-xl z-10 overflow-hidden">
        
        <div class="p-8 border-b border-slate-700 relative">
            <button onclick="window.location.href='admin-login.html'" class="absolute left-6 top-8 text-slate-400 hover:text-white transition-colors">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </button>
            <div class="text-center">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-lg bg-slate-700 mb-4 shadow-sm">
                    <i data-lucide="key-round" class="text-slate-300 w-6 h-6"></i>
                </div>
                <h1 class="text-xl font-bold text-white tracking-tight">Reset Password</h1>
                <p class="text-slate-400 text-sm mt-2 leading-relaxed px-4">Masukkan email admin Anda untuk menerima tautan pemulihan kata sandi.</p>
            </div>
        </div>

        <form class="p-8 flex flex-col gap-5" onsubmit="event.preventDefault(); alert('Tautan reset password telah dikirim ke email Anda.'); window.location.href='admin-login.html';">
            
            <div class="flex flex-col gap-2">
                <label for="email" class="text-sm font-medium text-slate-300">Alamat Email</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="mail" class="w-5 h-5 text-slate-500"></i>
                    </div>
                    <input type="email" id="email" required placeholder="admin@kampus.ac.id" class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-10 pr-4 py-3 text-slate-100 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder-slate-500">
                </div>
            </div>

            <button type="submit" class="w-full bg-blue-700 hover:bg-blue-600 text-white font-medium py-3 px-4 rounded-lg transition-colors mt-2 shadow-sm flex justify-center items-center gap-2">
                Kirim Tautan Reset
            </button>
            
        </form>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
